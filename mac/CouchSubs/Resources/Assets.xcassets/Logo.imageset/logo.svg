<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DodoSubs logosu: macOS Liquid Glass zemin üzerinde minimalist DS monogramı ve iki altyazı çizgisi -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1E2D47"/>
      <stop offset="50%" stop-color="#101829"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0.28" cy="0.16" r="0.65">
      <stop offset="0%" stop-color="#60C5FA" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="0.5" cy="0.82" r="0.48">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="38%" stop-color="#93C5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2ECF8"/>
      <stop offset="100%" stop-color="#B0C5DF"/>
    </linearGradient>
    <linearGradient id="subBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="52%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#topGlow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bottomGlow)"/>
    <ellipse cx="420" cy="140" rx="420" ry="220" fill="#FFFFFF" opacity="0.06"/>
  </g>
  <rect x="102.5" y="102.5" width="819" height="819" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Minimalist Geometrik DS Monogramı (optik boşluklu) -->
  <g fill="none" stroke="url(#silver)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 296 L 262 548 L 336 548 C 422 548 466 496 466 422 C 466 348 422 296 336 296 Z"/>
    <path d="M 744 338 C 724 304 690 292 648 292 C 594 292 558 320 558 358 C 558 398 594 414 652 424 C 714 434 756 452 756 496 C 756 538 714 554 652 554 C 602 554 566 538 548 506"/>
  </g>

  <!-- İki Sinematik Altyazı Çizgisi -->
  <rect x="292" y="652" width="440" height="48" rx="24" fill="url(#subBar)"/>
  <rect x="372" y="728" width="280" height="40" rx="20" fill="#E6F1FF" opacity="0.88"/>
</svg>
